title: Sanidhya Gupta
first_name: Sanidhya
last_name: Gupta
email: sanidhya.gupta@durham.ac.uk
github_username: SAN-G-8055
linkedin_username: sanidhya-gupta-79324719b

description: >-
  Academic website of Sanidhya Gupta, PhD Student in Computer Science at Durham
  University working on modular fault-tolerant quantum computing, distributed
  quantum error correction, and quantum networking.
keywords: >-
  Sanidhya Gupta, quantum computing, distributed quantum error correction,
  modular fault-tolerant quantum computing, Durham University, quantum
  networking, measurement-based quantum computation
lang: en
icon: "favicon.svg"
url: "https://san-g-8055.github.io"
baseurl: "/sanidhya-gupta"
last_updated: false
impressum_path: null
back_to_top: true
enable_navbar_social: false
enable_theme_social: false
enable_project_categories: false
enable_medium_zoom: true
enable_anchorjs: true
enable_math: false
enable_tooltips: true
navbar_fixed: true
footer_fixed: false
search_enabled: false
max_width: 1200px

al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false

repository: SAN-G-8055/sanidhya-gupta

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-socials
  - jekyll-twitter-plugin
  - jemoji
  - classifier-reborn
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_ext_posts
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter

collections:
  pages:
    output: true
    permalink: /:path/
  news:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: news
    values:
      layout: post

scholar:
  source: _bibliography
  bibliography: papers.bib
  style: ieee
  locale: en
  sort_by: year
  order: descending
  query: "@*"
  bibtex_filters:
    - latex
    - smallcaps
  replace_strings: true
  join_strings: true

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  syntax_highlighter: rouge

include:
  - _pages

sass:
  style: compressed

# This block teaches the plugin how to handle academic links without crashing
jekyll-socials:
  custom_socials:
    scholar_userid:
      name: Google Scholar
      url: "https://scholar.google.com/citations?user="
      icon: "ai ai-google-scholar"

third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: "sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c="
    url:
      css: "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css"
    version: "7.2.0"
  academicons:
    integrity:
      css: "sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw="
    url:
      css: "https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css"
    version: "1.9.5"
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  highlightjs:
    integrity:
      css:
        light: "sha256-Oppd74ucMR5a5Dq96FxjEzGF7tTw2fZ/6ksAqDCM8GY="
        dark: "sha256-nyCNAiECsdDHrr/s2OQsp5l9XeY2ZJ0rMepjCT2AkBk="
    url:
      css:
        light: "https://cdn.jsdelivr.net/npm/highlight.js@{{version}}/styles/github.min.css"
        dark: "https://cdn.jsdelivr.net/npm/highlight.js@{{version}}/styles/github-dark.min.css"
    version: "11.9.0"

footer_text: >-
  Theme: <a href="https://github.com/alshedivat/al-folio">al-folio</a>

exclude:
  - README.md
